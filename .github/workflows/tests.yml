name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build uses a Java 17 toolchain; Gradle itself runs on 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      # The repository doesn't include the Gradle wrapper jar, so install Gradle directly
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      # Headless simulation tests; the slow evolution run is skipped by default
      - name: Run tests
        run: gradle core:test --console=plain -Dorg.gradle.logging.level=lifecycle

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: core/build/reports/tests/test
